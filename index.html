<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big House in the Sky - 3D Platformer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #333;
      }
      canvas {
        display: block;
      }
      #death-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: red;
        font-family: Arial, sans-serif;
        font-size: 48px;
        font-weight: bold;
        text-shadow: 2px 2px 4px black;
        display: none;
      }
      #win-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #7fff00;
        font-family: Arial, sans-serif;
        font-size: 48px;
        font-weight: bold;
        text-shadow: 2px 2px 6px black;
        display: none;
      }
      #hud {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-family: monospace;
        background: rgba(0,0,0,0.5);
        padding: 10px 14px;
        border-radius: 6px;
        text-align: center;
        display: grid;
        gap: 6px;
      }
      #score {
        font-weight: bold;
      }
      #info {
        font-size: 12px;
        line-height: 1.4;
      }
      #goal-status.treasure-complete {
        color: #ffd27d;
        display: inline-block;
        animation: treasure-pulse 0.6s ease-in-out infinite;
      }
      @keyframes treasure-pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); }
      }
      #level-panel {
        position: absolute;
        top: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        font-family: monospace;
        color: white;
      }
      #level-panel button {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
      }
      #level-panel button.active {
        background: rgba(127, 255, 0, 0.2);
        border-color: rgba(127, 255, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="level-panel"></div>
    <div id="death-message">You died!</div>
    <div id="win-message">Course Clear!</div>
    <div id="hud">
      <div id="score">Coins: 0</div>
      <div id="checkpoint">Checkpoint: start</div>
      <div id="goal-status">Goal: Locked</div>
      <div id="info">WASD/arrows move, Space or Q rise, Shift or E dive, C toggles first-person. Choose level top-left.</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
