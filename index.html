<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big House in the Sky - 3D Platformer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #333;
      }
      canvas {
        display: block;
      }
      #death-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: red;
        font-family: Arial, sans-serif;
        font-size: 48px;
        font-weight: bold;
        text-shadow: 2px 2px 4px black;
        display: none;
      }
      #win-message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #7fff00;
        font-family: Arial, sans-serif;
        font-size: 48px;
        font-weight: bold;
        text-shadow: 2px 2px 6px black;
        display: none;
      }
      #hud {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-family: monospace;
        background: rgba(0,0,0,0.5);
        padding: 10px 14px;
        border-radius: 6px;
        text-align: center;
        display: grid;
        gap: 6px;
      }
      #score {
        font-weight: bold;
      }
      #info {
        font-size: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="death-message">You died!</div>
    <div id="win-message">Course Clear!</div>
    <div id="hud">
      <div id="score">Coins: 0</div>
      <div id="checkpoint">Checkpoint: start</div>
      <div id="info">WASD or arrows to move, Space to jump. Explore the sky castle!</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
